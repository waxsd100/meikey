# cargo-make のタスク（cargo install cargo-make で入れる）
#
#   cargo make                          # CI と同じ確認（整形・clippy・全テスト）
#   cargo make test                     # 全テスト（引数はそのまま cargo nextest run に渡る）
#   cargo make test --lib               #   ユニットテストだけ
#   cargo make test --test it           #   IT だけ
#   cargo make proptest-deep            # proptest の試行回数を100倍にして全テスト
#   cargo make mutants                  # ミューテーションテスト
#   cargo make sde                      # Intel SDE で、この PC に無い命令セット（AVX-512 など）の経路もテスト
#   cargo make run wakokara --bench 10  # 速度と期待時間を測る（--low-security で低セキュリティモード。
#                                       # その上で --gpu で GPU、--both で GPU と CPU の両方）
#   cargo make run wakokara -C wakokara -o ~/.ssh/id_ed25519_wakokara  # 鍵を探して書き出す
#   cargo make build                    # 最適化ビルド（target/release/meikey）
#   cargo make ptx                      # GPU のカーネル（kernel.cu）を変えたら、埋め込む PTX（設定ごと）を作り直す（NVRTC が要る）
#   cargo make breakdown                # 1鍵あたりの計算時間を実装ごとに比べる
#
# run・build・breakdown は、実行するCPU向けに最適化（-C target-cpu=native）してビルドする。

[config]
skip_core_tasks = true

[tasks.default]
alias = "ci"

[tasks.ci]
description = "整形の確認・clippy・全テスト（nextest は doctest を回さないので cargo test --doc も）。feature amx を有効にしたとき・cuda を外したときの clippy と、AMX・GPU・CLI のテストも"
dependencies = ["install-nextest"]
# 警告が1つでもあれば失敗させる（Cargo の build.warnings。-D warnings と違って rustc のフラグが
# 変わらないので、普段のビルドのキャッシュをそのまま使える。テストのビルドの警告も対象）
env = { CARGO_BUILD_WARNINGS = "deny" }
script_runner = "@duckscript"
script = '''
exec --fail-on-error cargo fmt --all --check
exec --fail-on-error cargo clippy --all-targets
exec --fail-on-error cargo clippy --all-targets --all-features
exec --fail-on-error cargo clippy --all-targets --no-default-features
exec --fail-on-error cargo nextest run
exec --fail-on-error cargo nextest run --all-features -E "test(/^service::(derive::amx|gpu)::/) | test(/^controller::/)"
exec --fail-on-error cargo nextest run --no-default-features -E "test(/^controller::/)"
exec --fail-on-error cargo test --doc
'''

[tasks.test]
description = "全テスト（引数はそのまま cargo nextest run に渡る。設定は .config/nextest.toml）"
dependencies = ["install-nextest"]
command = "cargo"
args = ["nextest", "run", "${@}"]

[tasks.proptest-deep]
description = "proptest の試行回数を MEIKEY_PROPTEST_SCALE 倍（既定 100）にして、最適化ビルドで全テスト"
env = { MEIKEY_PROPTEST_SCALE = { value = "100", condition = { env_not_set = ["MEIKEY_PROPTEST_SCALE"] } } }
dependencies = ["install-nextest"]
command = "cargo"
args = ["nextest", "run", "--cargo-profile", "proptest", "--profile", "deep", "${@}"]

# controller/cli.rs の配線は mockall のモックを使ったユニットテストで確かめる。
# 表示するだけの部分（main.rs・cli.rs の main と check_features）は IT で確かめているので対象外
# （変異ごとに IT まで回すと遅い）
[tasks.mutants]
description = "本体を少しずつ壊して、ユニットテストが検出できるか調べる"
env = { MEIKEY_PROPTEST_SCALE = "0.1" }
dependencies = ["install-nextest"]
command = "cargo"
args = ["mutants", "--test-tool", "nextest", "--jobs", "2", "--exclude", "src/main.rs", "--exclude-re", "^src/controller/cli\\.rs:.*\\b(main|check_features)\\b", "${@}", "--", "--lib"]

# Intel SDE（Intel の命令エミュレーター）で CPU を4種類真似て、SIMD の経路のテストを回す。
# AVX-512 に対応していない PC でも、AVX-512 IFMA・AVX-512F の経路を実際に実行して確かめられる。
# それぞれで、その CPU にある命令セットを MEIKEY_REQUIRE_SIMD で必須にするので、黙って飛ばされない。
# ただし AMX は、OS（Linux）にタイルを使う許可をもらう必要があり、本物の CPU が AMX に対応していないと
# 許可が下りないので必須にしない（spr で、AMX のある CPU の Linux なら AMX のテストも回る）。
# AMX の経路（feature amx）も入れてビルドする。
# エミュレーションは遅いので、最適化したテスト用ビルド（proptest プロファイル）で回す。
# SDE は https://www.intel.com/content/www/us/en/download/684897/ から入れ、環境変数 SDE に
# sde64（Windows では sde.exe）のパスを入れておく
[tasks.sde]
description = "Intel SDE で Sapphire Rapids（AMX）・Ice Lake サーバー（IFMA）・Skylake サーバー（AVX-512F）・Alder Lake（AVX2 まで）を真似て SIMD のテスト"
dependencies = ["install-nextest"]
script_runner = "@duckscript"
script = '''
sde = get_env SDE
assert ${sde} "環境変数 SDE に Intel SDE（sde64 / sde.exe）のパスを入れてください"
# CPU:その CPU で必須にする命令セット
cases = array "spr:avx2,avx512,avx512-ifma" "icx:avx2,avx512,avx512-ifma" "skx:avx2,avx512" "adl:avx2"
for case in ${cases}
    parts = split ${case} :
    cpu = array_get ${parts} 0
    need = array_get ${parts} 1
    echo "---- SDE -${cpu}（必須: ${need}）"
    set_env CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER "${sde} -${cpu} --"
    set_env CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER "${sde} -${cpu} --"
    set_env MEIKEY_REQUIRE_SIMD ${need}
    exec --fail-on-error cargo nextest run --cargo-profile proptest --features amx --lib -E "test(/^service::derive::(amx|avx2|avx512|sha512x4|sha512x8|tests)::/)"
end
'''

[tasks.run]
description = "最適化ビルドで meikey を実行する（引数はそのまま meikey に渡る）"
env = { RUSTFLAGS = "-C target-cpu=native" }
command = "cargo"
args = ["run", "--release", "--quiet", "--", "${@}"]

[tasks.build]
description = "最適化ビルド（target/release/meikey）"
env = { RUSTFLAGS = "-C target-cpu=native" }
command = "cargo"
args = ["build", "--release"]

# 埋め込む PTX の版は NVRTC の版で決まり、それより古いドライバでは読めないので、古い NVRTC（CUDA 12.0）で作る:
#   pip install --target /tmp/nvrtc "nvidia-cuda-nvrtc-cu12==12.0.*"
#   LD_LIBRARY_PATH=/tmp/nvrtc/nvidia/cuda_nvrtc/lib cargo make ptx
[tasks.ptx]
description = "GPU のカーネル（src/service/gpu/kernel.cu）から、埋め込む PTX（src/service/gpu/ptx/ の設定ごとのファイル）を作る"
command = "cargo"
args = ["run", "--quiet", "--example", "gen_ptx"]

[tasks.breakdown]
description = "1鍵あたりの計算時間を実装ごとに比べる"
env = { RUSTFLAGS = "-C target-cpu=native" }
command = "cargo"
args = ["run", "--release", "--quiet", "--example", "breakdown"]

[tasks.install-nextest]
private = true
install_crate = { crate_name = "cargo-nextest", binary = "cargo", test_arg = ["nextest", "--version"] }
install_crate_args = ["--locked"]
