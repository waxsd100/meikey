# 整形・clippy・全テスト（cargo make ci と同じ確認）を、Linux と Windows で回す
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同じブランチで新しく push したら、前の実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 警告が 1 つでもあれば失敗させる（cargo make ci と同じ）
  CARGO_BUILD_WARNINGS: deny

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml の版を入れる
      - run: rustup show
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        features: [default, all-features, no-default-features]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.features }}
      - name: cargo clippy
        shell: bash
        run: |
          case "${{ matrix.features }}" in
            default) flags="" ;;
            *) flags="--${{ matrix.features }}" ;;
          esac
          cargo clippy --all-targets $flags

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # 全テスト（GPU が無いので、GPU で動かすテストは飛ばす。カーネルを CPU 向けにコンパイルしたテストは回る）
      - run: cargo nextest run --profile ci
      # feature amx を有効にしたときと、cuda を外したときに変わるテスト
      - run: cargo nextest run --profile ci --all-features -E "test(/^service::(derive::amx|gpu)::/) | test(/^controller::/)"
      - run: cargo nextest run --profile ci --no-default-features -E "test(/^controller::/)"
      # nextest は doctest を回さない
      - run: cargo test --doc
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # テストのカバレッジ（行）を測る。master では、README のバッジが読む JSON をブランチ badges に置く
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov
      # 計測を入れた開発ビルドではテストが遅すぎるので、--release で測る
      - run: cargo llvm-cov nextest --profile ci --release --json --summary-only --output-path coverage.json
      - name: Write badge data
        run: |
          percent=$(jq '.data[0].totals.lines.percent' coverage.json)
          rounded=$(printf '%.1f' "$percent")
          color=$(awk -v p="$percent" 'BEGIN { print (p >= 90 ? "brightgreen" : p >= 80 ? "green" : p >= 70 ? "yellowgreen" : p >= 60 ? "yellow" : "red") }')
          mkdir -p badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$rounded" "$color" > badges/coverage.json
          echo "Line coverage: ${rounded}%" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: badges
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coverage.json
          git commit -qm "coverage ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # 本物の GPU で、GPU のテスト（PTX の読み込み・起動・設定を測って選ぶところまで）を回す。
  # 自分のマシン（NVIDIA の GPU とドライバ、Rust、Windows なら Visual Studio の C++ ビルドツールが入ったもの）を
  # ラベル `gpu` を付けた self-hosted runner として登録し、リポジトリの変数 GPU_RUNNER を true にしたときだけ動く
  # （登録していないのに動かすと、runner を待ち続けるため）。
  # 他人のプルリクエストのコードを自分のマシンで動かさないよう、プルリクエストでは動かさない
  gpu:
    name: test (GPU, self-hosted)
    if: github.event_name != 'pull_request' && vars.GPU_RUNNER == 'true'
    runs-on: [self-hosted, gpu]
    env:
      # GPU が見つからなければ、テストを飛ばさずに失敗させる
      MEIKEY_REQUIRE_SIMD: cuda
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --profile ci -E "test(/^service::gpu::/)"
